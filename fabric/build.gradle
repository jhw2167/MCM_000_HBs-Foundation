plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
}
version = "${mod_version}"
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    implementation("net.blay09.mods:balm-fabric:${balm_version}") {
        transitive = false
    }
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
}

loom {
    // 26.1: no access widener needed on Fabric. CreativeModeTab.Output is public in vanilla/Fabric
    // mojmap; it is only protected under NeoForge's patches, which the NeoForge access transformer
    // (common/src/main/resources/META-INF/accesstransformer.cfg) handles. Do NOT wire an .accesswidener
    // here — Loom rejects a named-namespace widener for this setup ("Expected official namespace").
    mixin {
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}